server {
    listen 80;
    root /app/public;
    index index.html;

    # Vektorové dlaždice se gzipem zmenší asi o 38 % (dlaždice z14 nad Jičínem 293 → 181 kB).
    # Ve výchozím stavu nginx komprimuje jen text/html, ostatní typy je potřeba vyjmenovat.
    gzip on;
    gzip_vary on;
    gzip_types application/vnd.mapbox-vector-tile application/json application/javascript text/css;

    # Mapu a její statické soubory obslouží nginx, API a dlaždice jdou do PHP.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # Žádný jiný PHP soubor není veřejný.
    location ~ \.php$ {
        return 404;
    }
}
