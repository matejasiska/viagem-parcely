services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: katastr
      POSTGRES_USER: katastr
      POSTGRES_PASSWORD: katastr
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katastr -d katastr"]
      interval: 5s
      timeout: 5s
      retries: 30

  import:
    build: ./import
    environment:
      PGHOST: db
      PGDATABASE: katastr
      PGUSER: katastr
      PGPASSWORD: katastr
      OKRES_KOD: "3604"
    volumes:
      - ./import:/import:ro
      - import-cache:/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  php:
    build: ./docker/php
    environment:
      DB_DSN: "pgsql:host=db;port=5432;dbname=katastr"
      DB_USER: katastr
      DB_PASSWORD: katastr
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - tile-cache:/app/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - php

volumes:
  db-data:
  import-cache:
  tile-cache:
